<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" opacity="0.12">
  <defs>
    <style>
      .flower-line { stroke: #D65A3C; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .leaf-line { stroke: #12233F; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Top Right Lily Cluster -->
  <g transform="translate(420, 100) scale(1.1) rotate(15)">
    <!-- Lily Petals -->
    <path class="flower-line" d="M0,0 C-30,-60 -20,-120 0,-160 C20,-120 30,-60 0,0" />
    <path class="flower-line" d="M0,0 C-60,-30 -120,-40 -160,-20 C-120,0 -60,10 0,0" />
    <path class="flower-line" d="M0,0 C30,-40 90,-60 140,-50 C120,-10 60,10 0,0" />
    <path class="flower-line" d="M0,0 C-40,30 -80,80 -100,130 C-70,100 -30,60 0,0" />
    <path class="flower-line" d="M0,0 C20,40 60,90 110,120 C80,80 40,40 0,0" />
    <!-- Stamens and Pistil -->
    <path class="flower-line" d="M0,0 C-10,-40 -15,-70 -12,-90" />
    <circle cx="-12" cy="-90" r="3" fill="#D65A3C" />
    <path class="flower-line" d="M0,0 C10,-40 15,-70 12,-90" />
    <circle cx="12" cy="-90" r="3" fill="#D65A3C" />
    <path class="flower-line" d="M0,0 C0,-50 2,-80 0,-105" />
    <circle cx="0" cy="-105" r="4" fill="#D65A3C" />
    <!-- Stem & Leaves -->
    <path class="leaf-line" d="M0,0 C10,60 15,140 10,220" />
    <path class="leaf-line" d="M12,80 C40,70 80,80 110,110 C80,120 40,110 12,80" />
    <path class="leaf-line" d="M10,130 C-20,130 -60,150 -80,190 C-50,190 -20,170 10,130" />
  </g>

  <!-- Bottom Left Lily and Botanical Spray -->
  <g transform="translate(100, 680) scale(1.3) rotate(-25)">
    <path class="flower-line" d="M0,0 C-25,-50 -20,-100 0,-140 C20,-100 25,-50 0,0" />
    <path class="flower-line" d="M0,0 C-50,-25 -100,-35 -140,-15 C-100,5 -50,15 0,0" />
    <path class="flower-line" d="M0,0 C30,-30 80,-45 120,-35 C100,-5 50,10 0,0" />
    <path class="flower-line" d="M0,0 C-35,25 -70,65 -85,110 C-60,85 -25,50 0,0" />
    <path class="flower-line" d="M0,0 C20,30 50,70 90,95 C65,65 35,30 0,0" />
    <path class="leaf-line" d="M0,0 C-10,70 -15,150 -10,230" />
    <path class="leaf-line" d="M-10,90 C-40,85 -70,100 -95,130 C-70,140 -35,130 -10,90" />
  </g>

  <!-- Subtle Floating Petals and Leaves in Center / Margin -->
  <g transform="translate(80, 260) scale(0.8) rotate(45)">
    <path class="leaf-line" d="M0,0 C20,-30 50,-40 80,-30 C70,-10 40,10 0,0" />
    <path class="leaf-line" d="M0,0 L80,-30" stroke-dasharray="2 3" />
  </g>
  <g transform="translate(520, 480) scale(0.9) rotate(-30)">
    <path class="leaf-line" d="M0,0 C30,-20 60,-25 90,-10 C70,10 40,20 0,0" />
    <path class="leaf-line" d="M0,0 L90,-10" stroke-dasharray="2 3" />
  </g>
</svg>
